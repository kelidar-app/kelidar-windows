name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Kelidar follows a phased [roadmap](https://github.com/kelidar-app/kelidar-windows/blob/main/docs/ROADMAP.md) and keeps advanced features out of sight until they are needed. Please check [the feature list](https://github.com/kelidar-app/kelidar-windows/blob/main/docs/FEATURES.md) first; your idea may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other tools or workarounds
      description: How do you do this today, or how does another SSH client do it?
