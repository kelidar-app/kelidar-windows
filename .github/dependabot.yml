version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Conventional Commits, so Release Please reads them: runtime dependencies
    # are fixes (they produce a release), development tools are chores.
    # Electron and React are development dependencies but ship in the app:
    # when merging one of those, retitle it "fix(deps): ..." to release it.
    commit-message:
      prefix: 'fix(deps)'
      prefix-development: 'chore(deps)'
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns: ['electron']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns: ['*']
