name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Check that the lockfile uses the public npm registry
        run: npm run lockfile:check

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test (Playwright on Electron)
        run: npm run test:e2e

      - name: Build installer
        run: npx electron-builder --config electron-builder.config.ts --win --x64 --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-windows-x64
          path: dist/*.exe
          if-no-files-found: error

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
